name: Daily Automated Commit

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions 

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git User
        run: |
          git config user.name "svnfnty"
          git config user.email "jundel.caroz13@gmail.com"

      - name: Create Multiple Realistic Empty Commits & Push
        run: |
          # Array of realistic human commit messages
          MESSAGES=(
            "feat: update navigation tab styling"
            "fix: resolve mobile layout overflow issue"
            "refactor: optimize component state rendering"
            "chore: update internal dependencies and configs"
            "style: refine button hover states and transitions"
            "docs: update API documentation references"
            "perf: enhance asset loading speed"
            "fix: correct typo in error modal text"
            "feat: add fallback UI for missing data"
            "refactor: clean up unused helper utility functions"
            "style: align card spacing and margins"
            "fix: handle edge case in form validation"
            "feat: update primary button color gradient"
            "chore: clean up project build script"
            "refactor: modularize header navigation code"
            "perf: optimize image rendering performance"
            "fix: resolve dropdown menu focus state"
            "style: polish dark mode theme colors"
            "docs: clarify setup instructions in README"
            "feat: improve table responsiveness on mobile"
            "fix: prevent duplicate form submit events"
            "refactor: extract reusable button component"
            "style: adjust typography scale and line height"
            "feat: update icon set for action bar"
            "chore: organize project asset files"
          )
          
          # Generate between 31 and 51 commits
          NUM_COMMITS=$(( ( RANDOM % 21 ) + 1 ))
          echo "Creating $NUM_COMMITS commits today..."
          
          ARRAY_SIZE=${#MESSAGES[@]}
          for i in $(seq 1 $NUM_COMMITS); do
            RAND_INDEX=$(( RANDOM % ARRAY_SIZE ))
            MSG="${MESSAGES[$RAND_INDEX]}"
            git commit --allow-empty -m "$MSG"
          done
          
          git push
